name: Discover new quotes

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-mazzulla-quotes
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test updater and widget
        run: |
          python -m unittest discover -s test -p 'test_*.py'
          npm test
      - name: Discover and append qualifying quotes
        run: python scripts/update_quotes.py --write
      - name: Commit only the quote feed if it changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- quotes.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- quotes.json
          git commit -m 'Add newly discovered Mazzulla quotes' -- quotes.json
          git push origin "HEAD:$DEFAULT_BRANCH"
